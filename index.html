const pad = (n) => String(n).padStart(2, "0");
const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtWon = (n) => n.toLocaleString("ko-KR");

function emptyEntry(dateKey) {
  return {
    date: dateKey, type: null, mood: null, weather: null, weatherNote: "",
    transactions: [], summary: "", tomorrow: "", details: {},
  };
}
function centerStrip(d) {
  const arr = [];
  for (let i = -3; i <= 3; i++) {
    const nd = new Date(d);
    nd.setDate(d.getDate() + i);
    arr.push(nd);
  }
  return arr;
}

// ================= 로그인 화면 =================
function AuthScreen() {
  const [mode, setMode] = useState("login"); // login | signup
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setError("");
    if (!email.trim() || !password) { setError("이메일과 비밀번호를 입력해주세요"); return; }
    setBusy(true);
    try {
      if (mode === "login") {
        await auth.signInWithEmailAndPassword(email.trim(), password);
      } else {
        await auth.createUserWithEmailAndPassword(email.trim(), password);
      }
    } catch (e) {
      setError(errMsg(e.code));
    } finally {
      setBusy(false);
    }
  };

  const errMsg = (code) => {
    if (code === "auth/invalid-email") return "이메일 형식이 올바르지 않아요";
    if (code === "auth/user-not-found") return "가입되지 않은 이메일이에요";
    if (code === "auth/wrong-password" || code === "auth/invalid-credential") return "비밀번호가 맞지 않아요";
    if (code === "auth/email-already-in-use") return "이미 가입된 이메일이에요";
    if (code === "auth/weak-password") return "비밀번호는 6자 이상이어야 해요";
    return "문제가 발생했어요. 잠시 후 다시 시도해주세요";
  };

  return (
    <div style={{ minHeight: "100vh", background: C.paper, display: "flex", justifyContent: "center", alignItems: "center", padding: 20 }}>
      <div style={{ width: "100%", maxWidth: 360, background: C.card, borderRadius: 12, border: `1px solid ${C.line}`, padding: 28 }}>
        <div style={{ fontFamily: FONT_SERIF, fontSize: 24, marginBottom: 4 }}>간편다이어리</div>
        <div style={{ fontSize: 13, color: C.inkFaint, marginBottom: 22 }}>
          {mode === "login" ? "로그인하고 오늘 하루를 기록해요" : "새 계정을 만들어요"}
        </div>
        <input
          placeholder="이메일" value={email} onChange={(e) => setEmail(e.target.value)}
          style={underlineInput}
        />
        <input
          placeholder="비밀번호" type="password" value={password}
          onChange={(e) => setPassword(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()}
          style={{ ...underlineInput, marginTop: 16 }}
        />
        {error && <div style={{ color: C.expense, fontSize: 13, marginTop: 10 }}>{error}</div>}
        <button onClick={submit} disabled={busy} style={primaryBtn}>
          {busy ? "처리 중…" : mode === "login" ? "로그인" : "회원가입"}
        </button>
        <div style={{ textAlign: "center", marginTop: 16, fontSize: 13, color: C.inkSoft }}>
          {mode === "login" ? (
            <span>계정이 없으신가요? <a onClick={() => setMode("signup")} style={linkStyle}>회원가입</a></span>
          ) : (
            <span>이미 계정이 있으신가요? <a onClick={() => setMode("login")} style={linkStyle}>로그인</a></span>
          )}
        </div>
      </div>
    </div>
  );
}

// ================= 다이어리 앱 =================
function DiaryApp({ user }) {
  const [today] = useState(() => new Date());
  const [selected, setSelected] = useState(() => new Date());
  const [strip, setStrip] = useState(() => centerStrip(new Date()));
  const [entry, setEntry] = useState(() => emptyEntry(toKey(new Date())));
  const [datesWithData, setDatesWithData] = useState(() => new Set());
  const [detailSuggestions, setDetailSuggestions] = useState({}); // `${type}:${key}` -> string[]
  const [allEntries, setAllEntries] = useState([]); // 통계용 전체 엔트리 캐시
  const [showStats, setShowStats] = useState(false);
  const [statsMonth, setStatsMonth] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() + 1 }; });
  const [showSummary, setShowSummary] = useState(false);
  const [status, setStatus] = useState("");
  const [txDraft, setTxDraft] = useState({ kind: "지출", category: null, amount: "", memo: "" });
  const amountRef = useRef(null);
  const memoRef = useRef(null);
  const [loading, setLoading] = useState(true);

  const docId = (dateKey) => `${user.uid}_${dateKey}`;

  // 데이터 있는 날짜 목록 + 자유입력 자동완성 제안 + 통계용 전체 엔트리 수집
  useEffect(() => {
    (async () => {
      try {
        const snap = await db.collection("diary_entries").where("uid", "==", user.uid).get();
        const dateSet = new Set();
        const sugMap = {}; // `${type}:${fieldKey}` -> Set of strings
        const entries = [];
        snap.forEach((doc) => {
          const d = doc.data();
          entries.push(d);
          dateSet.add(d.date);
          if (d.type && d.details) {
            Object.keys(d.details).forEach((k) => {
              const v = d.details[k];
              if (typeof v === "string" && v.trim()) {
                const mapKey = `${d.type}:${k}`;
                if (!sugMap[mapKey]) sugMap[mapKey] = new Set();
                sugMap[mapKey].add(v.trim());
              }
            });
          }
        });
        const sugObj = {};
        Object.keys(sugMap).forEach((k) => { sugObj[k] = Array.from(sugMap[k]).sort(); });
        setDatesWithData(dateSet);
        setDetailSuggestions(sugObj);
        setAllEntries(entries);
      } catch (e) { /* 무시 */ }
    })();
  }, []);

  useEffect(() => {
    const key = toKey(selected);
    setLoading(true);
    setShowSummary(false);
    (async () => {
      try {
        const doc = await db.collection("diary_entries").doc(docId(key)).get();
        if (doc.exists) setEntry(doc.data());
        else setEntry(emptyEntry(key));
      } catch (e) {
        setEntry(emptyEntry(key));
      } finally {
        setLoading(false);
      }
    })();
  }, [selected]);

  const save = useCallback(async (next) => {
    const key = next.date;
    setEntry(next);
    try {
      await db.collection("diary_entries").doc(docId(key)).set(
        { ...next, uid: user.uid, updatedAt: firebase.firestore.FieldValue.serverTimestamp() },
        { merge: true }
      );
      setDatesWithData((prev) => new Set(prev).add(key));
      setAllEntries((prev) => {
        const others = prev.filter((e) => e.date !== key);
        return [...others, { ...next, uid: user.uid }];
      });
      setStatus("저장됨");
      setTimeout(() => setStatus(""), 1200);
    } catch (e) {
      setStatus("저장 실패");
      setTimeout(() => setStatus(""), 1500);
    }
  }, [user.uid]);

  const setField = (field, value) => save({ ...entry, [field]: value });
  const setDetail = (key, value) => save({ ...entry, details: { ...(entry.details || {}), [key]: value } });

  const addTransaction = () => {
    if (!txDraft.category) { window.alert("카테고리를 먼저 선택해주세요"); return; }

    const amountInput = window.prompt(`${txDraft.kind} · ${txDraft.category}\n\n금액을 숫자로 입력해주세요`, "");
    if (amountInput === null) return; // 취소
    const normalized = amountInput.replace(/[\uFF10-\uFF19]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
    const amt = parseInt(normalized.replace(/[^0-9]/g, ""), 10);
    if (!amt) { window.alert(`금액이 올바르지 않아요. 입력하신 값: "${amountInput}"`); return; }

    const memoInput = window.prompt("메모 (선택, 없으면 빈칸으로 확인)", "") || "";

    const ok = window.confirm(`${txDraft.kind} · ${txDraft.category} · ${fmtWon(amt)}원${memoInput ? " · " + memoInput : ""}\n\n이 내용을 추가할까요?`);
    if (!ok) return;

    const tx = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), kind: txDraft.kind, category: txDraft.category, amount: amt, memo: memoInput.trim() };
    const nextTransactions = [...entry.transactions, tx];
    save({ ...entry, transactions: nextTransactions });
    setTxDraft((d) => ({ ...d, category: null }));

    let newIncome = 0, newExpense = 0;
    for (const t of nextTransactions) { if (t.kind === "수입") newIncome += t.amount; else newExpense += t.amount; }
    window.alert(`추가됐어요.\n\n오늘 총 항목 수: ${nextTransactions.length}개\n총 수입: ${fmtWon(newIncome)}원\n총 지출: ${fmtWon(newExpense)}원`);
  };
  const removeTransaction = (id) => save({ ...entry, transactions: entry.transactions.filter((t) => t.id !== id) });

  const totals = useMemo(() => {
    let income = 0, expense = 0;
    for (const t of entry.transactions) { if (t.kind === "수입") income += t.amount; else expense += t.amount; }
    return { income, expense };
  }, [entry.transactions]);

  const resetEntry = async () => {
    const ok = window.confirm(`${dateLabel} 기록을 전부 초기화할까요?\n되돌릴 수 없어요.`);
    if (!ok) return;
    const key = toKey(selected);
    try {
      await db.collection("diary_entries").doc(docId(key)).delete();
    } catch (e) { /* 문서가 없었을 수도 있음 */ }
    setEntry(emptyEntry(key));
    setDatesWithData((prev) => { const next = new Set(prev); next.delete(key); return next; });
    setAllEntries((prev) => prev.filter((e) => e.date !== key));
    setStatus("초기화됨");
    setTimeout(() => setStatus(""), 1200);
  };

  const goPrevWeek = () => { const nd = new Date(strip[0]); nd.setDate(nd.getDate() - 4); setStrip(centerStrip(nd)); };
  const goNextWeek = () => { const nd = new Date(strip[strip.length - 1]); nd.setDate(nd.getDate() + 4); setStrip(centerStrip(nd)); };

  const dateLabel = `${selected.getMonth() + 1}월 ${selected.getDate()}일 (${WEEKDAY[selected.getDay()]})`;

  return (
    <div style={{ background: C.paper, minHeight: "100vh", display: "flex", justifyContent: "center", padding: "20px 0 60px" }}>
      <div style={{ width: "100%", maxWidth: 420, padding: "0 16px" }}>
        <div style={{ marginBottom: 18, display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <div style={{ fontSize: 13, color: C.inkFaint }}>간편다이어리</div>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
              <div style={{ fontFamily: FONT_SERIF, fontSize: 26, marginTop: 2 }}>{dateLabel}</div>
              <label htmlFor="date-jump" style={{ fontSize: 15, color: C.inkFaint, cursor: "pointer" }}>📅</label>
              <input
                id="date-jump"
                type="date"
                value={toKey(selected)}
                onChange={(e) => {
                  if (!e.target.value) return;
                  const [y, m, d] = e.target.value.split("-").map(Number);
                  const nd = new Date(y, m - 1, d);
                  setSelected(nd);
                  setStrip(centerStrip(nd));
                }}
                style={{ position: "absolute", width: 1, height: 1, opacity: 0, pointerEvents: "none" }}
              />
            </div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 8, marginTop: 4 }}>
            <button onClick={() => auth.signOut()} style={{ background: "none", border: "none", color: C.inkFaint, fontSize: 12, cursor: "pointer" }}>
              로그아웃
            </button>
            <button onClick={() => setShowStats((s) => !s)} style={{ background: "none", border: "none", color: C.inkSoft, fontSize: 12, cursor: "pointer" }}>
              {showStats ? "일기로 돌아가기" : "📊 통계 보기"}
            </button>
            <button onClick={resetEntry} style={{ background: "none", border: "none", color: C.expense, fontSize: 12, cursor: "pointer" }}>
              이 날짜 초기화
            </button>
          </div>
        </div>

        {showStats ? (
          <StatsView entries={allEntries} month={statsMonth} setMonth={setStatsMonth} />
        ) : (
        <>
        <div style={{ display: "flex", alignItems: "center", marginBottom: 22 }}>
          <button onClick={goPrevWeek} style={navBtnStyle}>‹</button>
          <div style={{ display: "flex", flex: 1, justifyContent: "space-between" }}>
            {strip.map((d) => {
              const key = toKey(d);
              const isSel = key === toKey(selected);
              const isToday = key === toKey(today);
              const hasData = datesWithData.has(key);
              return (
                <button key={key} onClick={() => setSelected(new Date(d))}
                  style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4, background: "none", border: "none", cursor: "pointer", padding: "6px 0", width: 34 }}>
                  <span style={{ fontSize: 11, color: isSel ? C.accent : C.inkFaint }}>{WEEKDAY[d.getDay()]}</span>
                  <span style={{
                    width: 28, height: 28, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: 14, fontWeight: isSel ? 700 : 400,
                    background: isSel ? C.accent : "transparent",
                    color: isSel ? "#fff" : isToday ? C.accent : C.ink,
                    border: isToday && !isSel ? `1px solid ${C.accent}` : "none",
                  }}>{d.getDate()}</span>
                  <span style={{ width: 4, height: 4, borderRadius: "50%", background: hasData ? C.accent : "transparent" }} />
                </button>
              );
            })}
          </div>
          <button onClick={goNextWeek} style={navBtnStyle}>›</button>
        </div>

        {loading ? (
          <div style={{ color: C.inkFaint, fontSize: 14, padding: "40px 0", textAlign: "center" }}>불러오는 중…</div>
        ) : (
          <>
            <Section title="오늘의 개요">
              <FieldLabel>어떤 하루였나요</FieldLabel>
              <PillRow options={TYPES} value={entry.type} onChange={(v) => setField("type", v === entry.type ? null : v)} />
              <FieldLabel style={{ marginTop: 16 }}>기분</FieldLabel>
              <PillRow options={MOODS} value={entry.mood} onChange={(v) => setField("mood", v === entry.mood ? null : v)} />
              <FieldLabel style={{ marginTop: 16 }}>날씨</FieldLabel>
              <PillRow options={WEATHERS} value={entry.weather} onChange={(v) => setField("weather", v === entry.weather ? null : v)} />
              <input placeholder="한 줄 환경 메모 (선택)" value={entry.weatherNote} onChange={(e) => setField("weatherNote", e.target.value)} style={underlineInput} />
            </Section>

            {entry.type && DETAIL_FIELDS[entry.type] && (
              <Section title={`${entry.type} 세부 기록`}>
                {DETAIL_FIELDS[entry.type].map((f, i) => (
                  <div key={f.key} style={{ marginTop: i === 0 ? 0 : 16 }}>
                    <FieldLabel>{f.label}</FieldLabel>
                    {f.type === "rating" ? (
                      <RatingRow value={(entry.details || {})[f.key] || 0} onChange={(v) => setDetail(f.key, v)} />
                    ) : f.type === "select" ? (
                      <PillRow options={f.options} value={(entry.details || {})[f.key] || null} onChange={(v) => setDetail(f.key, v === (entry.details || {})[f.key] ? null : v)} />
                    ) : (
                      <>
                        <input
                          placeholder={f.placeholder || ""}
                          value={(entry.details || {})[f.key] || ""}
                          onChange={(e) => setDetail(f.key, e.target.value)}
                          list={`sug-${entry.type}-${f.key}`}
                          autoComplete="off"
                          style={underlineInput}
                        />
                        <datalist id={`sug-${entry.type}-${f.key}`}>
                          {(detailSuggestions[`${entry.type}:${f.key}`] || []).map((v) => (
                            <option key={v} value={v} />
                          ))}
                        </datalist>
                      </>
                    )}
                  </div>
                ))}
              </Section>
            )}

            <Section title="수입 · 지출">
              <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
                <Totals label="수입" value={totals.income} color={C.income} />
                <Totals label="지출" value={totals.expense} color={C.expense} />
              </div>
              {entry.transactions.length > 0 && (
                <div style={{ marginBottom: 14 }}>
                  {entry.transactions.map((t) => (
                    <div key={t.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 0", borderBottom: `1px solid ${C.line}`, fontSize: 14 }}>
                      <div>
                        <span style={{ color: t.kind === "수입" ? C.income : C.expense, fontWeight: 600 }}>{t.category}</span>
                        {t.memo && <span style={{ color: C.inkFaint, marginLeft: 6 }}>{t.memo}</span>}
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <span style={{ color: t.kind === "수입" ? C.income : C.expense }}>{t.kind === "수입" ? "+" : "-"}{fmtWon(t.amount)}원</span>
                        <button onClick={() => removeTransaction(t.id)} style={{ background: "none", border: "none", color: C.inkFaint, cursor: "pointer", fontSize: 14 }}>×</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
              <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
                {["지출", "수입"].map((k) => (
                  <button key={k} onClick={() => setTxDraft((d) => ({ ...d, kind: k, category: null }))}
                    style={{ ...smallPill, background: txDraft.kind === k ? C.ink : "transparent", color: txDraft.kind === k ? "#fff" : C.inkSoft, borderColor: txDraft.kind === k ? C.ink : C.line }}>
                    {k}
                  </button>
                ))}
              </div>
              <FieldLabel>카테고리</FieldLabel>
              <PillRow
                options={txDraft.kind === "수입" ? INCOME_CATEGORIES : EXPENSE_CATEGORIES}
                value={txDraft.category}
                onChange={(v) => setTxDraft((d) => ({ ...d, category: v === d.category ? null : v }))}
              />
              <div style={{ marginTop: 12 }}>
                <button onClick={addTransaction} style={{ ...addBtnStyle, width: "100%", padding: "12px 0" }}>+ 항목 추가</button>
              </div>
              {status && <div style={{ fontSize: 12.5, color: C.accent, marginTop: 8 }}>{status}</div>}
            </Section>

            <Section title="하루 마무리">
              <FieldLabel>한 줄 총평</FieldLabel>
              <input placeholder="오늘 하루를 한 문장으로" value={entry.summary} onChange={(e) => setField("summary", e.target.value)} style={underlineInput} />
              <FieldLabel style={{ marginTop: 14 }}>내일 다짐</FieldLabel>
              <input placeholder="내일은 이렇게" value={entry.tomorrow} onChange={(e) => setField("tomorrow", e.target.value)} style={underlineInput} />
            </Section>

            <button onClick={() => setShowSummary((s) => !s)} style={{ width: "100%", padding: "14px 0", background: C.accent, color: "#fff", border: "none", borderRadius: 8, fontSize: 15, fontWeight: 600, cursor: "pointer", marginTop: 4 }}>
              {showSummary ? "요약 카드 닫기" : "한 장에 정리하기"}
            </button>

            {showSummary && <SummaryCard entry={entry} dateLabel={dateLabel} totals={totals} />}

            <div style={{ textAlign: "center", fontSize: 12, color: C.inkFaint, height: 20, marginTop: 10 }}>{status}</div>
          </>
        )}
        </>
        )}
      </div>
    </div>
  );
}

function StatsView({ entries, month, setMonth }) {
  const monthKey = `${month.y}-${pad(month.m)}`;
  const monthEntries = entries.filter((e) => e.date && e.date.startsWith(monthKey));

  let income = 0, expense = 0;
  const catTotals = {};
  const typeCounts = {};
  const detailCounts = {};

  monthEntries.forEach((e) => {
    if (e.type) typeCounts[e.type] = (typeCounts[e.type] || 0) + 1;
    (e.transactions || []).forEach((t) => {
      if (t.kind === "수입") income += t.amount; else expense += t.amount;
      if (!catTotals[t.category]) catTotals[t.category] = { income: 0, expense: 0 };
      if (t.kind === "수입") catTotals[t.category].income += t.amount; else catTotals[t.category].expense += t.amount;
    });
    if (e.type && e.details && DETAIL_FIELDS[e.type]) {
      DETAIL_FIELDS[e.type].forEach((f) => {
        if (f.type === "select") {
          const v = e.details[f.key];
          if (v) {
            const groupKey = `${e.type} · ${f.label}`;
            if (!detailCounts[groupKey]) detailCounts[groupKey] = {};
            detailCounts[groupKey][v] = (detailCounts[groupKey][v] || 0) + 1;
          }
        }
      });
    }
  });

  const sortedCats = Object.entries(catTotals).sort((a, b) => b[1].expense - a[1].expense);
  const sortedTypes = Object.entries(typeCounts).sort((a, b) => b[1] - a[1]);

  const goPrevMonth = () => { let y = month.y, m = month.m - 1; if (m < 1) { m = 12; y--; } setMonth({ y, m }); };
  const goNextMonth = () => { let y = month.y, m = month.m + 1; if (m > 12) { m = 1; y++; } setMonth({ y, m }); };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 18 }}>
        <button onClick={goPrevMonth} style={navBtnStyle}>‹</button>
        <div style={{ fontFamily: FONT_SERIF, fontSize: 20 }}>{month.y}년 {month.m}월 통계</div>
        <button onClick={goNextMonth} style={navBtnStyle}>›</button>
      </div>

      {monthEntries.length === 0 ? (
        <div style={{ color: C.inkFaint, fontSize: 14, padding: "30px 0", textAlign: "center" }}>이 달엔 기록이 없어요.</div>
      ) : (
        <>
          <Section title="이번 달 가계부">
            <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
              <Totals label="수입" value={income} color={C.income} />
              <Totals label="지출" value={expense} color={C.expense} />
            </div>
            {sortedCats.length === 0 ? (
              <div style={{ color: C.inkFaint, fontSize: 14 }}>가계부 기록 없음</div>
            ) : (
              sortedCats.map(([cat, v]) => (
                <div key={cat} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${C.line}`, fontSize: 14 }}>
                  <span>{cat}</span>
                  <span>
                    {v.expense > 0 && <span style={{ color: C.expense }}>-{fmtWon(v.expense)}원</span>}
                    {v.income > 0 && <span style={{ color: C.income, marginLeft: 8 }}>+{fmtWon(v.income)}원</span>}
                  </span>
                </div>
              ))
            )}
          </Section>

          <Section title="이번 달 하루 유형">
            {sortedTypes.map(([t, c]) => (
              <div key={t} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${C.line}`, fontSize: 14 }}>
                <span>{t}</span><span>{c}일</span>
              </div>
            ))}
          </Section>

          {Object.keys(detailCounts).length > 0 && (
            <Section title="세부 항목 통계">
              {Object.entries(detailCounts).map(([group, counts]) => (
                <div key={group} style={{ marginBottom: 14 }}>
                  <FieldLabel>{group}</FieldLabel>
                  {Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([v, c]) => (
                    <div key={v} style={{ display: "flex", justifyContent: "space-between", fontSize: 14, padding: "4px 0" }}>
                      <span>{v}</span><span>{c}회</span>
                    </div>
                  ))}
                </div>
              ))}
            </Section>
          )}
        </>
      )}
    </div>
  );
}

function Section({ title, children }) {
  return (
    <div style={{ background: C.card, borderRadius: 10, border: `1px solid ${C.line}`, padding: 18, marginBottom: 14 }}>
      <div style={{ fontFamily: FONT_SERIF, fontSize: 17, marginBottom: 14 }}>{title}</div>
      {children}
    </div>
  );
}
function FieldLabel({ children, style }) {
  return <div style={{ fontSize: 12.5, color: C.inkSoft, marginBottom: 8, ...style }}>{children}</div>;
}
function PillRow({ options, value, onChange }) {
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
      {options.map((o) => (
        <button key={o} onClick={() => onChange(o)}
          style={{ ...smallPill, background: value === o ? C.ink : "transparent", color: value === o ? "#fff" : C.inkSoft, borderColor: value === o ? C.ink : C.line }}>
          {o}
        </button>
      ))}
    </div>
  );
}
function RatingRow({ value, onChange }) {
  return (
    <div style={{ display: "flex", gap: 6 }}>
      {[1, 2, 3, 4, 5].map((n) => (
        <button key={n} onClick={() => onChange(n === value ? 0 : n)}
          style={{ background: "none", border: "none", cursor: "pointer", fontSize: 22, padding: 0, color: n <= value ? C.accent : C.line }}>
          ★
        </button>
      ))}
    </div>
  );
}
function Totals({ label, value, color }) {
  return (
    <div style={{ flex: 1, border: `1px solid ${C.line}`, borderRadius: 8, padding: "10px 12px" }}>
      <div style={{ fontSize: 12, color: C.inkSoft }}>{label}</div>
      <div style={{ fontSize: 17, fontWeight: 700, color }}>{fmtWon(value)}원</div>
    </div>
  );
}
function SummaryCard({ entry, dateLabel, totals }) {
  const weatherLine = entry.weather ? `${entry.weather}${entry.weatherNote ? " · " + entry.weatherNote : ""}` : entry.weatherNote;
  const moneyParts = [];
  if (totals.income > 0) moneyParts.push(`수입 ${fmtWon(totals.income)}원`);
  if (totals.expense > 0) moneyParts.push(`지출 ${fmtWon(totals.expense)}원`);
  const txDetail = entry.transactions.map((t) => `${t.category} ${fmtWon(t.amount)}`).join(" · ");
  const detailFields = (entry.type && DETAIL_FIELDS[entry.type]) || [];
  const detailParts = detailFields
    .map((f) => {
      const v = (entry.details || {})[f.key];
      if (!v) return null;
      if (f.type === "rating") return `${f.label} ${"★".repeat(v)}`;
      return `${f.label} ${v}`;
    })
    .filter(Boolean);
  const lines = [
    { show: true, node: <div style={{ fontFamily: FONT_SERIF, fontSize: 19 }}>{dateLabel}</div> },
    { show: !!weatherLine, node: <Line label="날씨">{weatherLine}</Line> },
    { show: !!(entry.mood || entry.type), node: <Line label="기분/유형">{[entry.mood, entry.type].filter(Boolean).join(" · ")}</Line> },
    { show: detailParts.length > 0, node: <Line label="세부">{detailParts.join(" · ")}</Line> },
    { show: moneyParts.length > 0, node: <Line label="가계부">{moneyParts.join(" · ")}</Line> },
    { show: !!txDetail, node: <Line label="내역">{txDetail}</Line> },
    { show: !!entry.summary, node: <div style={{ marginTop: 10, fontSize: 15, fontStyle: "italic" }}>“{entry.summary}”</div> },
    { show: !!entry.tomorrow, node: <div style={{ marginTop: 6, fontSize: 13.5, color: C.accent }}>내일 다짐 · {entry.tomorrow}</div> },
  ];
  const visible = lines.filter((l) => l.show);
  return (
    <div style={{ marginTop: 14, background: C.card, border: `1px solid ${C.line}`, borderRadius: 10, padding: 20 }}>
      {visible.length <= 1 ? (
        <div style={{ color: C.inkFaint, fontSize: 14 }}>{visible[0] ? visible[0].node : "아직 기록된 내용이 없어요."}</div>
      ) : (
        visible.map((l, i) => <div key={i}>{l.node}</div>)
      )}
    </div>
  );
}
function Line({ label, children }) {
  return <div style={{ fontSize: 14, color: C.inkSoft, marginTop: 6 }}><span style={{ color: C.inkFaint }}>{label} </span><span style={{ color: C.ink }}>{children}</span></div>;
}

const navBtnStyle = { background: "none", border: "none", fontSize: 20, color: C.inkFaint, cursor: "pointer", padding: "0 6px" };
const smallPill = { padding: "6px 12px", borderRadius: 20, border: `1px solid ${C.line}`, background: "transparent", fontSize: 13, cursor: "pointer" };
const underlineInput = { width: "100%", border: "none", borderBottom: `1px solid ${C.line}`, background: "transparent", padding: "8px 2px", fontSize: 14, color: C.ink, outline: "none", marginTop: 6, boxSizing: "border-box" };
const addBtnStyle = { padding: "0 16px", border: "none", borderRadius: 8, background: C.ink, color: "#fff", fontSize: 13, cursor: "pointer" };
const primaryBtn = { width: "100%", padding: "12px 0", background: C.accent, color: "#fff", border: "none", borderRadius: 8, fontSize: 15, fontWeight: 600, cursor: "pointer", marginTop: 22 };
const linkStyle = { color: C.accent, cursor: "pointer", fontWeight: 600 };

// ================= 루트 =================
function Root() {
  const [user, setUser] = useState(undefined); // undefined=확인중, null=비로그인

  useEffect(() => {
    const unsub = auth.onAuthStateChanged((u) => setUser(u));
    return unsub;
  }, []);

  if (user === undefined) {
    return <div style={{ minHeight: "100vh", background: C.paper, display: "flex", alignItems: "center", justifyContent: "center", color: C.inkFaint, fontSize: 14 }}>불러오는 중…</div>;
  }
  return user ? <DiaryApp user={user} /> : <AuthScreen />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Root />);
</script>

  // Babel의 자동 스캔(text/babel) 대신 수동으로 변환 실행 - classic 런타임 강제 지정으로
  // 자동 JSX 런타임이 import 구문을 끼워 넣어 발생하는 오류를 방지함
